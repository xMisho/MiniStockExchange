spring.application.name=mini-stock-exchange
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mini_stock_exchange}
spring.datasource.username=${DB_USERNAME:mini_stock_exchange}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=exchange
spring.flyway.default-schema=public
spring.flyway.clean-disabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# Token bucket capacities, refilled over each policy's documented interval.
verdex.rate-limit.login=10
verdex.rate-limit.registration=5
verdex.rate-limit.trading=60
verdex.rate-limit.external=180
verdex.rate-limit.reads=600
verdex.rate-limit.max-keys=10000

management.endpoints.web.exposure.include=metrics,prometheus
management.metrics.tags.application=verdex
verdex.risk.enabled=true
